<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav"
               [mode]="isHandset() ? 'over' : 'side'"
               [opened]="!isHandset()"
               [attr.role]="isHandset() ? 'dialog' : 'navigation'">
    <mat-toolbar>{{ 'app.menu' | translate }}</mat-toolbar>
    <mat-nav-list [attr.aria-label]="'app.main-navigation' | translate">
      @for (option of options(); track option.link) {
        <a mat-list-item [routerLink]="option.link" routerLinkActive="active" ariaCurrentWhenActive="page"
           (click)="isHandset() && drawer.close()">
          <mat-icon matListItemIcon aria-hidden="true">{{ option.icon }}</mat-icon>
          {{ option.label | translate }}
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>
  <mat-sidenav-content class="sidenav-content">
    <mat-toolbar color="primary">
      <button (click)="drawer.toggle()" [attr.aria-label]="'app.toggle-menu' | translate" mat-icon-button type="button">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
      <img [src]="logoUrl" alt="Barnes & Noble logo" class="logo"/>
      <span class="app-title">{{ 'app.title' | translate }}</span>
      <span class="spacer"></span>
      <app-language-switcher/>
    </mat-toolbar>
    <main class="main-content">
      <router-outlet/>
    </main>
    <app-footer-content/>
  </mat-sidenav-content>
</mat-sidenav-container>
